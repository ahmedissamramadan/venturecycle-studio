<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Signature</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'AlibabaSans';
            src: url('https://assets-persist.lovart.ai/agent-static-assets/AlibabaSans-Regular.otf') format('opentype');
            font-weight: 400;
        }
        @font-face {
            font-family: 'AlibabaSans';
            src: url('https://assets-persist.lovart.ai/agent-static-assets/AlibabaSans-Medium.otf') format('opentype');
            font-weight: 500;
        }
        @font-face {
            font-family: 'AlibabaSans';
            src: url('https://assets-persist.lovart.ai/agent-static-assets/Alibaba-PuHuiTi-Bold.otf') format('opentype');
            font-weight: 700;
        }

        body {
            margin: 0;
            padding: 0;
            width: 1920px;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'AlibabaSans', Arial, sans-serif;
        }

        .signature-container {
            width: 600px;
            background: #ffffff;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .logo-column {
            width: 100px;
            height: 100px;
            flex-shrink: 0;
        }

        .logo-column img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .content-column {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .name {
            font-size: 24px;
            font-weight: 700;
            color: #2D3436;
            margin: 0;
            line-height: 1.2;
        }

        .title {
            font-size: 16px;
            font-weight: 400;
            color: #636E72;
            margin: 0;
        }

        .company {
            font-size: 18px;
            font-weight: 700;
            color: #1ABC9C;
            margin: 0;
            margin-bottom: 10px;
        }

        .divider {
            height: 2px;
            background-color: #1ABC9C;
            width: 100%;
            margin: 10px 0 15px 0;
            border: none;
        }

        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #636E72;
            text-decoration: none;
        }

        .contact-item i {
            color: #1ABC9C;
            font-size: 16px;
            width: 20px;
            text-align: center;
        }

        .contact-item span {
            color: #2D3436;
        }
    </style>
</head>
<body>
    <div class="signature-container">
        <div class="logo-column">
            <img src="../assets/p-vc.png" alt="VentureCycle Studio Logo">
        </div>
        <div class="content-column">
            <h1 class="name">VentureCycle Studio</h1>
            <p class="title">Founder & AI Automation Systems Engineer</p>
            <p class="company">VentureCycle Studio</p>
            
            <hr class="divider">
            
            <div class="contact-list">
                <div class="contact-item">
                    <i class="ri-mail-fill"></i>
                    <span><a href="/cdn-cgi/l/email-protection" class="__cf_email__" data-cfemail="90f1f8fdf5f4d0e6f5fee4e5e2f5f3e9f3fcf5bee3e4e5f4f9ff">[email&#160;protected]</a></span>
                </div>
                <div class="contact-item">
                    <i class="ri-phone-fill"></i>
                    <span>+201501656010</span>
                </div>
                <div class="contact-item">
                    <i class="ri-global-line"></i>
                    <span>venturecycle.studio</span>
                </div>
                <div class="contact-item">
                    <i class="ri-map-pin-fill"></i>
                    <span>Cairo, Egypt</span>
                </div>
            </div>
        </div>
    </div>
<script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script></body>
</html>
